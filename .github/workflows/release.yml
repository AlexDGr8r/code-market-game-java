# Creates a GitHub release when you push a version tag, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
# It attaches the library JARs and the starter project. It does NOT publish to Maven Central;
# that is a separate, manual step.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check the tag matches the versions in the POMs
        run: |
          mvn_eval() { ./mvnw -q -B "$@" org.apache.maven.plugins:maven-help-plugin:3.6.0:evaluate -DforceStdout; }
          tag="${GITHUB_REF_NAME#v}"
          lib="$(mvn_eval -Dexpression=project.version)"
          starter="$(mvn_eval -f examples/pom.xml -Dexpression=code-market-game-api.version)"
          echo "tag: $tag  library: $lib  starter: $starter"
          if [ "$tag" != "$lib" ] || [ "$tag" != "$starter" ]; then
            echo "::error::Tag v$tag doesn't match pom.xml ($lib) and examples/pom.xml ($starter). Update both, then re-tag."
            exit 1
          fi

      - name: Build
        run: ./mvnw -B install

      - name: Build starter project against it
        working-directory: examples
        run: ./mvnw -B package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "target/code-market-starter-$v.zip" \
            "target/code-market-starter-$v.tar.gz" \
            "target/code-market-game-api-$v.jar" \
            "target/code-market-game-api-$v-sources.jar" \
            "target/code-market-game-api-$v-javadoc.jar"
